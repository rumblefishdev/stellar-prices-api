[workspace]
resolver = "3"
members = [
    "packages/prices-clickhouse",
    "packages/sdex-backfill",
    "packages/extractors-core",
    "packages/phoenix-extractor",
    "packages/soroswap-extractor",
    "packages/aquarius-extractor",
    "packages/ledger-processor",
    "packages/enrichment-worker",
]

[workspace.dependencies]
stellar-xdr = { version = "=26.0.0", features = ["curr"] }
stellar-strkey = "0.0.13"
sha2 = "0.10"
xdr-parser = { git = "https://github.com/rumblefishdev/soroban-block-explorer.git", branch = "develop" }
# TLS: `rustls-tls-ring` compiles in rustls with the ring crypto provider
# (lighter than the default aws-lc bundle, no cmake/C toolchain — friendlier for
# Lambda cross-builds). `rustls-tls-webpki-roots` bundles Mozilla roots so we can
# verify Caddy's Let's Encrypt server cert without relying on an OS trust store.
# Client-cert (mTLS) material is loaded at runtime in the prices-clickhouse crate.
clickhouse = { version = "0.13", features = ["inserter", "rustls-tls-ring", "rustls-tls-webpki-roots"] }
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive", "env"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust_decimal = { version = "1", features = ["serde-with-str"] }
thiserror = "2"
