services:
  clickhouse:
    # Pinned to the EXACT version running on ch-prod-01 (Hetzner) so local/CI
    # tests exercise the same engine as production — refreshable-MV semantics,
    # alias resolution and date/time functions can differ across CH releases.
    # Before changing this, re-check the live `SELECT version()` on ch-prod-01.
    image: clickhouse/clickhouse-server:26.3.10.60
    ports:
      - '8123:8123'
      - '9000:9000'
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - ./packages/prices-clickhouse/schema/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      CLICKHOUSE_DB: prices
      CLICKHOUSE_USER: default
      # LOAD-BEARING, not a dev convenience: with CLICKHOUSE_USER=default and
      # no password, this is the only clause in the image's entrypoint that
      # rewrites the `default` user with `::/0` networks and an empty password,
      # i.e. reachable from OUTSIDE the container. Delete it and `default` is
      # confined to the container's loopback — every ClickHouse integration
      # test (CI, task 0275) fails at connect time.
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    healthcheck:
      test: ['CMD', 'clickhouse-client', '--query', 'SELECT 1']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  clickhouse-data:
