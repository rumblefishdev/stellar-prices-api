# Daily watch for stellar-xdr protocol lag (task 0098).
#
# THIS FILE, NOT THE CI STEP, IS THE ACTUAL GUARD.
#
# Protocol 27 "Zipper" froze our live candle frontier for six days (tasks 0091
# / 0094). Nothing in this repository changed while that happened — mainnet
# moved and our pin stood still. A check that runs on push or pull_request
# cannot see that, because there is no push. So the guard has to be on a
# clock.
#
# `--watch` makes the comparison strict, and the strictness is the point:
#
#   * LAGGING (core supports a protocol newer than our pin) FAILS here, where
#     it is only a notice in CI. Horizon publishes `core_supported_protocol_
#     version` weeks before the vote, and that gap is the entire lead time
#     this task exists to buy. A warning nobody is obliged to read is what we
#     already had.
#   * An unreachable Horizon FAILS here too. A scheduled watch that quietly
#     checks nothing is precisely the shape of the outage being guarded
#     against — every signal green, nothing actually verified.
#
# A failing run reaches #stellar-prices-api-bot through the Slack GitHub app,
# subscribed to this workflow by name — see the delivery step below for the
# command and for why it is not a webhook.
#
# Run it by hand any time with `npm run xdr:watch-protocol-gap`.
name: XDR protocol watch

on:
  schedule:
    # Daily, off the hour — GitHub queues on-the-hour crons hardest and a
    # protocol vote is never so close that seventeen minutes decides it.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  protocol-gap:
    name: stellar-xdr vs mainnet protocol
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # The report is captured as well as printed, so the Slack message can
      # carry the actual numbers. A notification that only says "a job failed"
      # sends the reader back to the Actions tab, which is the surface this
      # whole task exists because nobody watches.
      - name: Compare the pinned stellar-xdr against mainnet (strict)
        id: gap
        run: |
          set +e
          report=$(npm run --silent xdr:watch-protocol-gap 2>&1)
          status=$?
          echo "$report"
          {
            echo 'report<<XDR_REPORT_EOF'
            echo "$report"
            echo 'XDR_REPORT_EOF'
          } >> "$GITHUB_OUTPUT"
          exit $status

      # DELIVERY — the Slack GitHub app, subscribed to this workflow by name:
      #
      #   /github subscribe rumblefishdev/stellar-prices-api \
      #       workflows:{name:"XDR protocol watch"}
      #
      # ...run once in #stellar-prices-api-bot. There is deliberately no
      # webhook and no secret here. The obvious route — an incoming webhook —
      # needs a Slack app, and the workspace is at its installed-app limit; the
      # other route, the SNS -> AWS Chatbot path every ops alarm uses (task
      # 0056), needs AWS credentials this workflow does not have and should not
      # be handed for one notification.
      #
      # ⚠️ The subscription matches on the workflow NAME above, exactly.
      # Renaming `name:` at the top of this file silently unsubscribes the
      # channel — the workflow keeps failing and the channel keeps quiet, which
      # is this task's own failure mode. Rename both together or not at all.
      #
      # What that costs: the app posts the run and a link, not our text. This
      # step buys most of it back — the report lands in the run's SUMMARY, so
      # it is the first thing visible after the click rather than something to
      # be dug out of a log.
      - name: Put the report on the run summary
        if: always()
        env:
          REPORT: ${{ steps.gap.outputs.report }}
        run: |
          {
            echo '## stellar-xdr protocol lag'
            echo
            echo '```'
            echo "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
