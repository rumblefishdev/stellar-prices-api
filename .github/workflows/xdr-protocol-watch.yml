# Daily watch for stellar-xdr protocol lag (task 0098).
#
# THIS FILE, NOT THE CI STEP, IS THE ACTUAL GUARD.
#
# Protocol 27 "Zipper" froze our live candle frontier for six days (tasks 0091
# / 0094). Nothing in this repository changed while that happened — mainnet
# moved and our pin stood still. A check that runs on push or pull_request
# cannot see that, because there is no push. So the guard has to be on a clock.
#
# `--watch` makes the comparison strict, and the strictness is the point:
#
#   * LAGGING (core supports a protocol newer than our pin) FAILS here, where
#     it is only a notice in CI. Horizon publishes `core_supported_protocol_
#     version` weeks before the vote, and that gap is the entire lead time this
#     task exists to buy. A warning nobody is obliged to read is what we
#     already had.
#   * An unreachable Horizon FAILS here too. A scheduled watch that quietly
#     checks nothing is precisely the shape of the outage being guarded
#     against — every signal green, nothing actually verified.
#
# Run it by hand any time with `npm run xdr:watch-protocol-gap`.
name: XDR protocol watch

on:
  schedule:
    # Daily, off the hour — GitHub queues on-the-hour crons hardest and a
    # protocol vote is never so close that seventeen minutes decides it.
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  protocol-gap:
    name: stellar-xdr vs mainnet protocol
    runs-on: ubuntu-latest
    steps:
      # ⚠️ `ref: develop`, and it is load-bearing.
      #
      # A `schedule` trigger only fires from the DEFAULT branch, which here is
      # `master` — a RELEASE branch, ~85 commits behind `develop`. So the
      # workflow file has to live on `master`, but master's `Cargo.toml` is a
      # release-old snapshot. Checking out the default branch would read a pin
      # that nobody deploys: we would bump `stellar-xdr` on `develop`, ship it,
      # and this watch would keep reporting the old number until the next
      # release merge — a guard reporting a stale reading, which is worse than
      # no guard.
      #
      # The deploy runbook builds from `develop`, so `develop` is what ships,
      # so `develop` is what gets measured. This also means only the WORKFLOW
      # needs to exist on `master`; the script comes from the checkout.
      - uses: actions/checkout@v4
        with:
          ref: develop

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # `node ...` directly rather than `npm run xdr:watch-protocol-gap`: one
      # less thing that has to agree across branches, and the script is
      # dependency-free on purpose so there is no `npm ci` to fail.
      #
      # The report is captured as well as printed so every downstream step —
      # the run summary, the issue body — can carry the actual numbers instead
      # of "a job failed".
      - name: Compare the pinned stellar-xdr against mainnet (strict)
        id: gap
        run: |
          set +e
          report=$(node tools/scripts/verify-xdr-protocol-gap.mjs --watch 2>&1)
          status=$?
          echo "$report"
          {
            echo 'report<<XDR_REPORT_EOF'
            echo "$report"
            echo 'XDR_REPORT_EOF'
          } >> "$GITHUB_OUTPUT"
          exit $status

      - name: Put the report on the run summary
        if: always()
        env:
          REPORT: ${{ steps.gap.outputs.report }}
        run: |
          {
            echo '## stellar-xdr protocol lag'
            echo
            echo '```'
            echo "$REPORT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # DELIVERY — one tracking issue, opened once and kept current.
      #
      # Slack was not available: the workspace is at its installed-app limit so
      # an incoming webhook cannot be created, the Slack GitHub app needs an
      # org-owner install we do not have, and SNS -> AWS Chatbot (the ops-alarm
      # path, task 0056) needs AWS credentials this workflow does not hold.
      # An issue needs none of that — `GITHUB_TOKEN` and the `issues: write`
      # permission above are enough.
      #
      # WHY IT DOES NOT COMMENT EVERY DAY
      # ---------------------------------
      # This condition persists for as long as the bump takes, which is days.
      # A daily comment on the same issue is a daily notification that says
      # nothing new, and the reliable outcome of that is a muted thread — at
      # which point the guard is worse than absent, because it looks present.
      #
      # So: notify on the two events that carry information, and stay silent
      # otherwise.
      #
      #   opened      first detection                        -> notification
      #   escalated   LAGGING -> BEHIND, mainnet has voted    -> notification
      #   unchanged   still the same tier                     -> body refresh
      #                                                          only, SILENT
      #   resolved    check passes                            -> comment+close
      #
      # The body is rewritten every run either way, so the issue is never
      # stale even on the silent days. GitHub's own scheduled-workflow failure
      # email fires daily and independently of all this; it goes to whoever
      # last edited the `cron:` line above.
      - name: Open or update the tracking issue
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          REPORT: ${{ steps.gap.outputs.report }}
          OUTCOME: ${{ steps.gap.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          TITLE='stellar-xdr lags the mainnet protocol'

          # Exact-title match rather than a label: a label has to exist before
          # it can be applied, and a missing one fails the step at the moment
          # it is most needed.
          number=$(gh issue list --repo "$REPO" --state open --limit 100 \
            --json number,title \
            --jq "[.[] | select(.title == \"$TITLE\")] | first | .number // empty")

          if [ "$OUTCOME" = "success" ]; then
            if [ -n "$number" ]; then
              gh issue comment "$number" --repo "$REPO" --body \
                "Resolved — the pinned \`stellar-xdr\` is level with mainnet again. Closed automatically by [this run]($RUN_URL)."
              gh issue close "$number" --repo "$REPO"
              echo "closed #$number"
            else
              echo "check passed, no open issue — nothing to do"
            fi
            exit 0
          fi

          # BEHIND means mainnet has already voted past us; LAGGING means it
          # has not yet. The transition between them is the single most
          # important moment in this issue's life, so it is the one thing
          # besides creation that is allowed to notify.
          tier=LAGGING
          case "$REPORT" in *"is BEHIND mainnet protocol"*) tier=BEHIND ;; esac

          body=$(cat <<EOF
          <!-- xdr-protocol-watch tier=$tier -->
          \`\`\`
          $REPORT
          \`\`\`

          **What this is.** The pinned \`stellar-xdr\` major tracks the Stellar
          protocol version. When mainnet advances past it the ledger-processor
          hits an XDR decode wall — and that failure is silent: the SQS queue
          drains normally, the DLQ stays empty, the Lambda logs no errors, and
          the doorbell-lag alarm watches queue age, which stays healthy. That
          is how protocol 27 froze the live candle frontier for six days.

          **What to do.** The bump is tracked as lore task **0277**, which also
          records the blocker: BE must bump \`xdr-parser\` first, because
          \`prices-ingest-core/src/decode.rs\` takes \`LedgerCloseMeta\` across
          that crate boundary.

          Opened and maintained automatically by \`.github/workflows/xdr-protocol-watch.yml\`
          (lore task 0098). It closes itself when the check passes. Last run:
          [$RUN_URL]($RUN_URL)
          EOF
          )
          body=$(printf '%s\n' "$body" | sed 's/^          //')

          if [ -z "$number" ]; then
            url=$(gh issue create --repo "$REPO" --title "$TITLE" --body "$body")
            echo "opened $url"
            exit 0
          fi

          previous=$(gh issue view "$number" --repo "$REPO" --json body --jq .body)
          gh issue edit "$number" --repo "$REPO" --body "$body"

          case "$previous" in
            *"tier=$tier"*)
              echo "#$number still $tier — body refreshed, no comment" ;;
            *)
              gh issue comment "$number" --repo "$REPO" --body \
                "⚠️ **Escalated to $tier.** Mainnet has moved past our pin — the decode wall is live or one ledger away. See [this run]($RUN_URL)."
              echo "#$number escalated to $tier" ;;
          esac
