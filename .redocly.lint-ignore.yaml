# Per-location lint exceptions for the published OpenAPI document (task 0124).
# See https://redocly.com/docs/cli/ — regenerate with `--generate-ignore-file`.
#
# EMPTY ON PURPOSE. `operation-4xx-response` stays ON globally (see
# redocly.yaml) and now passes unaided: it is what caught the seven key-gated
# operations that documented no 401/403 at all.
#
# `/health` and `/api-docs-json` were excepted here on the premise that they
# "genuinely have no 4xx to document". That premise was wrong, and the same
# branch's own stack comment said so: neither route is in the usage plan, but
# both are covered by the stage-wide `/*` `*` throttle, so API Gateway can 429
# either one. `/api-docs-json` can also 5xx, because a cache miss reaches the
# Lambda. Both now document those responses instead of suppressing the rule
# that asked for them, so the exceptions are gone rather than re-justified.
#
# Prefer documenting the response to adding an entry here. If one is genuinely
# unavoidable, say which response is missing and why it cannot exist.
target/openapi.json: {}
