# Per-location lint exceptions for the published OpenAPI document (task 0124).
# See https://redocly.com/docs/cli/ — regenerate with `--generate-ignore-file`.
#
# `operation-4xx-response` stays ON globally (see redocly.yaml): it is what
# caught the seven key-gated operations that documented no 401/403 at all.
# These two routes are excepted because they genuinely have no 4xx to document:
#
#   /health         a keyless API Gateway mock — it answers 200 or nothing.
#   /api-docs-json  anonymous and takes no input, so there is nothing to reject.
#
# If either route ever gains an error path, delete its entry rather than
# updating the description — the rule should start failing again.
target/openapi.json:
  operation-4xx-response:
    - '#/paths/~1api-docs-json/get/responses'
    - '#/paths/~1health/get/responses'
