[package]
name = "mtls-notafter-probe"
version = "0.1.0"
edition = "2024"
description = "Publishes mTLS client-cert days-to-NotAfter to CloudWatch for the cert-expiry alarm (task 0056)"

[lib]
name = "mtls_notafter_probe"
path = "src/lib.rs"

# EventBridge rate(1 day) Lambda entrypoint (task 0056). Behind `lambda` so the
# default build/test exercises the pure X.509 NotAfter / day-math without the
# AWS runtime / mTLS-fetch stack. Deployable:
#   cargo lambda build -p mtls-notafter-probe --release --arm64 --features lambda
[[bin]]
name = "mtls-notafter-probe"
path = "src/main.rs"
required-features = ["lambda"]

[features]
default = []
# Enables prices-clickhouse::mtls (the Secrets-Extension bundle fetch). The
# X.509 parsing itself is feature-free so it stays unit-testable in the default
# build.
aws-mtls = ["prices-clickhouse/aws-mtls"]
lambda = [
    "aws-mtls",
    "dep:lambda_runtime",
    "dep:aws-config",
    "dep:aws-sdk-cloudwatch",
]

[dependencies]
prices-clickhouse = { path = "../prices-clickhouse" }
x509-parser = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
thiserror = { workspace = true }

lambda_runtime = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-sdk-cloudwatch = { workspace = true, optional = true }
