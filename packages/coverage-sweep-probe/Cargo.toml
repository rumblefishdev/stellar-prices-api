[package]
name = "coverage-sweep-probe"
version = "0.1.0"
edition = "2024"
description = "Weekly sweep for swap-emitting contracts in neither pool_registry nor the committed allow-list, published to Prices/Coverage (task 0100)"

[lib]
name = "coverage_sweep_probe"
path = "src/lib.rs"

# EventBridge weekly Lambda entrypoint (task 0100). Behind `lambda` so the
# default build/test exercises the allow-list, SQL rendering and metric shaping
# without the AWS runtime / mTLS stack. Deployable:
#   cargo lambda build -p coverage-sweep-probe --release --arm64 --features lambda
[[bin]]
name = "coverage-sweep-probe"
path = "src/main.rs"
required-features = ["lambda"]

[features]
default = []
aws-mtls = ["prices-clickhouse/aws-mtls"]
lambda = [
    "aws-mtls",
    "dep:lambda_runtime",
    "dep:aws-config",
    "dep:aws-sdk-cloudwatch",
]

[dependencies]
prices-clickhouse = { path = "../prices-clickhouse" }
clickhouse = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
stellar-strkey = { workspace = true }

lambda_runtime = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-sdk-cloudwatch = { workspace = true, optional = true }
