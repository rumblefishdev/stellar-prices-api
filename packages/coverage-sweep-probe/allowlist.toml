# Coverage sweep allow-list (task 0100, layer 3 of the coverage model).
#
# The weekly coverage sweep reports every contract that emits swap- or
# trade-shaped Soroban events and is NOT in prices.pool_registry. An entry here
# takes a contract out of that residual on purpose. The sweep itself never
# registers anything: it only reports. Auto-registering a router would
# double-count the pool-level trades it wraps.
#
# Two entry kinds:
#
#   [[contract]]  one contract, permanent. `id` is the C… strkey; `wasm` is
#                 informational (64 lowercase hex) and does not widen the match.
#                 For routers, aggregators and other non-AMM emitters.
#
#   [[wasm]]      every contract running this wasm hash (64 lowercase hex).
#                 REQUIRES `until` = the task that removes the entry (normally
#                 the task that registers the family). A permanent family-wide
#                 ignore would hide the next pool of a real venue, so a [[wasm]]
#                 entry without `until` fails validation.
#
# Every entry needs a non-empty `reason` and `task`. Unknown keys are rejected.
#
# This file is compiled into the Lambda binary (include_str!). An edit is
# validated by `cargo test -p coverage-sweep-probe` and ships only with an
# EventBridge-stack deploy. Triage: docs/runbooks/0100-coverage-sweep-triage.md.

