[package]
name = "write-amplification-probe"
version = "0.1.0"
edition = "2024"
description = "Publishes max rows-written/hour per prices table to CloudWatch for the write-amplification alarm (task 0133)"

[lib]
name = "write_amplification_probe"
path = "src/lib.rs"

# EventBridge rate(1 hour) Lambda entrypoint (task 0133). Behind `lambda` so the
# default build/test exercises the pure metric-shaping logic without the AWS
# runtime / mTLS stack. Deployable:
#   cargo lambda build -p write-amplification-probe --release --arm64 --features lambda
[[bin]]
name = "write-amplification-probe"
path = "src/main.rs"
required-features = ["lambda"]

[features]
default = []
aws-mtls = ["prices-clickhouse/aws-mtls"]
lambda = [
    "aws-mtls",
    "dep:lambda_runtime",
    "dep:aws-config",
    "dep:aws-sdk-cloudwatch",
]

[dependencies]
prices-clickhouse = { path = "../prices-clickhouse" }
clickhouse = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }

lambda_runtime = { workspace = true, optional = true }
aws-config = { workspace = true, optional = true }
aws-sdk-cloudwatch = { workspace = true, optional = true }
