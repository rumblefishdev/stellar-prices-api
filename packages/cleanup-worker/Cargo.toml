[package]
name = "cleanup-worker"
version = "0.1.0"
edition = "2024"
description = "Prices cleanup worker — daily partition-drop retention on prices.* (task 0039)"

[lib]
name = "cleanup_worker"
path = "src/lib.rs"

# EventBridge cron(0 2 * * *) Lambda entrypoint. Behind `lambda` so default
# build/test stays lean. Deployable: cargo lambda build -p cleanup-worker
# --release --arm64 --features lambda (the `lambda` feature is required or
# the bin is skipped; ADR 0006).
[[bin]]
name = "cleanup-worker"
path = "src/main.rs"
required-features = ["lambda"]

[features]
default = []
aws-mtls = ["prices-clickhouse/aws-mtls"]
lambda = ["aws-mtls", "dep:lambda_runtime"]

[dependencies]
prices-clickhouse = { path = "../prices-clickhouse" }
clickhouse = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

lambda_runtime = { workspace = true, optional = true }
