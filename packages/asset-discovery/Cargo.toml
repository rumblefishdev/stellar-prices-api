[package]
name = "asset-discovery"
version = "0.1.0"
edition = "2024"
description = "Asset Discovery worker — seeds + discovers prices.assets (task 0054)"

[lib]
name = "asset_discovery"
path = "src/lib.rs"

# The EventBridge-scheduled Lambda entrypoint. Behind `lambda` so a default
# `cargo build` (and `cargo test` for the lib + seed logic) stays lean — no
# lambda_runtime / aws-config / rustls mTLS stack. Build the deployable with
# `cargo lambda build -p asset-discovery --release --arm64 --features lambda`
# (the `lambda` feature is required or the bin is skipped; ADR 0006).
[[bin]]
name = "asset-discovery"
path = "src/main.rs"
required-features = ["lambda"]

[features]
default = []
# Remote ClickHouse over mTLS via the task-0052 prices-clickhouse::mtls client.
aws-mtls = ["prices-clickhouse/aws-mtls"]
# Full Lambda: scheduled runtime + the mTLS sink + the S3 ledger fetcher
# (prices-ledger-processor's `lambda` feature gates S3Fetcher).
lambda = ["aws-mtls", "dep:lambda_runtime", "prices-ledger-processor/lambda"]

[dependencies]
prices-ingest-core = { path = "../prices-ingest-core" }
prices-clickhouse = { path = "../prices-clickhouse" }
# Reused for the Galexie S3 key scheme + ObjectFetcher trait (LocalDiskFetcher
# in tests, S3Fetcher behind `lambda`) — so discovery fetches ledgers by the
# exact same scheme as the live processor (0038), no drift.
prices-ledger-processor = { path = "../prices-ledger-processor" }

stellar-xdr = { workspace = true }
# Task 0210 symbol stage: Soroban RPC `simulateTransaction` against a token
# contract's `symbol()`. Same set (and the same reqwest feature list)
# oracle-worker uses for its Reflector calls.
stellar-strkey = { workspace = true }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls-webpki-roots",
    "json",
] }
clickhouse = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

lambda_runtime = { workspace = true, optional = true }
