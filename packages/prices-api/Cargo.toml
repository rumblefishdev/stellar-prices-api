[package]
name = "prices-api"
version = "0.1.0"
edition = "2024"
description = "Public Prices REST API — axum read handlers on a single Lambda (task 0040, ADR 0008)"

[lib]
name = "prices_api"
path = "src/lib.rs"

# Single axum Lambda serving ALL route groups (ADR 0008 — not five per-route
# binaries). Behind `lambda` so the default build/test exercises the router via
# tower `oneshot` without the AWS runtime / mTLS stack. Deploy:
#   cargo lambda build -p prices-api --release --arm64 --features lambda
# The `lambda` feature is REQUIRED or the bin is skipped (ADR 0006 pattern,
# mirrors enrichment-worker).
[[bin]]
name = "prices-api"
path = "src/main.rs"
required-features = ["lambda"]

[features]
default = []
aws-mtls = ["prices-clickhouse/aws-mtls"]
lambda = ["aws-mtls", "dep:lambda_http"]
# Local HTTP server (src/bin/serve.rs) for dev + load testing. No extra deps —
# reuses tokio (net) + axum::serve + the plaintext CH client.
local-server = []

[[bin]]
name = "serve"
path = "src/bin/serve.rs"
required-features = ["local-server"]

[dependencies]
axum = { workspace = true }
clickhouse = { workspace = true }
serde = { workspace = true }
serde_json = "1"
thiserror = { workspace = true }
tokio = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
stellar-strkey = { workspace = true }
base64 = "0.22"
prices-clickhouse = { path = "../prices-clickhouse" }

# ---------------------------------------------------------------------------
# Portal sign-in (task 0186) — Discord OAuth2 + the signed cookies around it.
# ---------------------------------------------------------------------------
# All four are UNCONDITIONAL, not behind the `lambda` feature, because the whole
# of the flow except the Secrets Manager read is exercised by `tests/portal_auth.rs`
# in the default build — including the real token exchange, against an axum mock
# of Discord bound to loopback. Gating them would make the one part worth testing
# the one part CI never compiles.
#
# `getrandom` rather than `rand`: the `state` nonce, the PKCE verifier and the
# session are security tokens, so they want OS entropy directly rather than a
# userspace PRNG that happens to be seeded from it.
#
# `reqwest` mirrors `prices-clickhouse`'s (0.12, no default features) with TLS
# added — that crate only ever talks to `localhost:2773`, this one talks to
# discord.com. `rustls-tls-webpki-roots` pins the roots into the binary instead
# of trusting the Lambda image's store, which `provided.al2023` does ship but
# which nothing in this repo asserts the contents of.
hmac = "0.12"
sha2 = { workspace = true }
getrandom = "0.3"
form_urlencoded = "1"
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls-webpki-roots",
] }

lambda_http = { workspace = true, optional = true }

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
