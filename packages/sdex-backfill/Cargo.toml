[package]
name = "sdex-backfill"
version = "0.1.0"
edition = "2024"
description = "SDEX historical backfill CLI — local workstation tool mirroring BE's backfill-runner pattern"

[[bin]]
name = "sdex-backfill"
path = "src/main.rs"

[features]
default = []
# Direct-write to Hetzner `prices.*` over the task-0052 mTLS client (ADR 0009):
# adds `--transport hetzner`, which builds the sink from an on-disk client-cert
# bundle. Gated so the default local-plaintext build (Docker CH, CI) does not
# pull the rustls / hyper-util stack. Delegates to `prices-clickhouse`'s
# `aws-mtls` feature, which exposes the `mtls` module.
aws-mtls = ["prices-clickhouse/aws-mtls"]

[dependencies]
stellar-xdr = { workspace = true }
stellar-strkey = { workspace = true }
sha2 = { workspace = true }
xdr-parser = { workspace = true }
clickhouse = { workspace = true }
tokio = { workspace = true }
clap = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
rust_decimal = { workspace = true }
thiserror = { workspace = true }
prices-ingest-core = { path = "../prices-ingest-core" }
prices-clickhouse = { path = "../prices-clickhouse" }

[dev-dependencies]
extractors-core = { path = "../extractors-core" }
